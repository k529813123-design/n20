const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{const h=await open_(pw);
    if(remember){try{localStorage.setItem("n20pw",pw)}catch(e){}}
    document.open();document.write(h);document.close();
  }catch(e){document.getElementById("msg").textContent="パスワードが違います";
    try{localStorage.removeItem("n20pw")}catch(_){}}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
  document.getElementById("msg").textContent="確認中…";
  go(document.getElementById("pw").value,document.getElementById("keep").checked)});
let saved=null;try{saved=localStorage.getItem("n20pw")}catch(e){}
